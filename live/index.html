<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex,nofollow"><meta name="referrer" content="no-referrer">
  <meta name="theme-color" content="#17121f"><title>Live captions — Merge Film Festival</title>
  <link rel="icon" href="../assets/img/favicon.ico"><link rel="stylesheet" href="../assets/css/live.css?v=4">
</head>
<body class="audience-page">
  <main class="audience-shell">
    <header class="masthead"><a class="wordmark" href="../">MERGE<span>FILM FESTIVAL</span></a><span class="status-pill" id="viewer-status" role="status">Connecting…</span></header>
    <section class="live-stage">
      <div class="stage-text"><span class="eyebrow" id="stage-label">LIVE CAPTIONS</span><h1 id="talk-title">Merge Film Festival</h1>
        <div class="live-caption-window" id="caption-window"><p id="captions" class="live-caption" lang="en" role="log" aria-live="polite" aria-atomic="true">Captions will appear when the talk begins.</p></div>
        <p id="viewer-message" class="viewer-message" role="status"></p>
      </div>
      <!-- Who is translating, and where to find them. The QR is a file, not a
           library: the room screen must draw it even with no JS left to run. -->
      <aside class="brand-rail">
        <span class="eyebrow" id="brand-label">LIVE TRANSLATION BY</span>
        <img class="brand-mark" src="../assets/img/ui/merge-mark.jpg" alt="Merge Film Festival" width="440" height="440" decoding="async">
        <a class="brand-qr" href="https://mergefestival.ch" target="_blank" rel="noopener"><img src="../assets/img/ui/merge-qr.svg" alt="" width="232" height="232"><span>mergefestival.ch</span></a>
      </aside>
    </section>
    <footer class="audience-footer"><span><span id="source-note">Automatically translated in real time.</span><br><span id="accuracy-note">Names and expressions may contain errors.</span></span><span class="audience-contact"><span id="contact-note">Live caption enquiries</span><br><a href="mailto:thomas@tommyzaffa.com">thomas@tommyzaffa.com</a> · <a href="mailto:info@mergefestival.ch">info@mergefestival.ch</a></span><div class="viewer-controls"><label for="text-size" class="sr-only" id="size-label">Caption size</label><select id="text-size"><option value="standard">Standard text</option><option value="large">Large text</option></select><button id="fullscreen">Full screen ↗</button></div></footer>
  </main>
  <script src="../assets/js/passes-config.js?v=2"></script><script src="../assets/js/vendor/supabase-2.113.0.js"></script>
  <script src="../assets/js/live-core.js?v=4"></script><script src="../assets/js/live-viewer.js?v=5"></script>
</body>
</html>
